name: Audit demo import (read only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/seed-*'
      - 'package*.json'
      - '.github/workflows/seed-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EduardoCR90/restaurant-premium-sanity
          ref: main
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run seed:export
        working-directory: frontend
      - run: npm run seed:audit
        env:
          SANITY_IMPORT_TOKEN: ${{ secrets.SANITY_IMPORT_TOKEN || secrets.SANITY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salitre-import-review
          path: import-review/
          retention-days: 7
