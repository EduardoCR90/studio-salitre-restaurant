name: Validate standalone Sanity Studio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: salitre-studio-build
          path: dist/
          retention-days: 7
